[platformio]
default_envs = a6v3

[env:a6v3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DBOARD_HAS_PSRAM
build_unflags = -std=gnu++11
lib_deps = bblanchon/ArduinoJson@7.3.1
monitor_speed = 115200
extra_scripts = pre:scripts/embed.py

[env:native]
platform = native@1.2.1
build_flags = -std=c++17 -Iinclude
build_src_filter = -<*> +<../native/main.cpp>
